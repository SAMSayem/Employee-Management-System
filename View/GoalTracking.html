<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Goal Tracking</title>
  <link rel="stylesheet" href="../CSS/GoalTracking .css">
</head>
<body>
  <header>
    <h1>Employee Goal Tracker</h1>
  </header>

  <main>
    <form id="goalForm">
      <label for="employee">Employee:</label>
      <input type="text" id="employee" required>

      <label for="goal">Goal Description:</label>
      <textarea id="goal" rows="4" required></textarea>

      <label for="status">Progress Status:</label>
      <select id="status" required>
        <option value="">Select</option>
        <option value="Not Started">Not Started</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>

      <button type="submit">Add Goal</button>
    </form>

    <section id="goalList"></section>
  </main>

  <script src="../JS/GoalTracking.js"></script>
</body>
</html>
