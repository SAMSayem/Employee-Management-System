<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee List</title>
  <link rel="stylesheet" href="../asset/CSS/style.css" />
</head>
<body>
  <header>
    <h1>Employee Directory</h1>
    <nav>
      <a href="../View/EmployeeList.html">Employee List</a>
      <a href="../View/ProfileViewer.html">Profile Viewer</a>
      <a href="../View/AdvSearch.html">Advanced Search</a>
    </nav>
  </header>

  <main>
    <section id="employeeForm">
      <h2>Add New Employee (HR)</h2>
      <form id="addEmployeeForm">
        <input type="text" id="empName" placeholder="Full Name" required />
        <input type="text" id="empSkill" placeholder="Skill(s)" required />
        <input type="file" id="empDocs" />
        <input type="text" id="empID" placeholder="Assign ID" required />
        <button type="submit">Add Employee</button>
      </form>
    </section>

    <section id="employeeList">
      <h2>Employee Directory</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Skill</th>
            <th>Contact</th>
          </tr>
        </thead>
        <tbody id="directoryBody"></tbody>
      </table>
      <button onclick="exportCSV()">Export as CSV</button>
    </section>
  </main>

  <script src="../asset/JS/script.js"></script>
</body>
</html>
