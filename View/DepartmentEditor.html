<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Department Editor</title>
  <link rel="stylesheet" href="../asset/CSS/DepartmentEditor.css">
</head>
<body>
  <header>
    <h1>Department Structure</h1>
    <nav>
      <a href="../View/DepartmentEditor.html">Department Editor</a>
      <a href="../View/ReportingLines.html">Reporting Lines</a>
    </nav>
  </header>

  <main>
    <div class="dept-container" id="deptA" ondrop="drop(event, 'deptA')" ondragover="allowDrop(event)">
      <h3>Division A</h3>
    </div>
    <div class="dept-container" id="deptB" ondrop="drop(event, 'deptB')" ondragover="allowDrop(event)">
      <h3>Division B</h3>
    </div>
    <div class="dept-container" id="deptC" ondrop="drop(event, 'deptC')" ondragover="allowDrop(event)">
      <h3>Division C</h3>
    </div>

    <div id="departments">
      <div id="eng" class="department blue" draggable="true" ondragstart="drag(event)">Engineering</div>
      <div id="sales" class="department green" draggable="true" ondragstart="drag(event)">Sales</div>
      <div id="HR" class="department red" draggable="true" ondragstart="drag(event)">HR</div>
      <div id="Marketing" class="department orange" draggable="true" ondragstart="drag(event)">Marketing</div>
    </div>
  </main>

  <script src="../asset/JS/DepartmentEditor.js"></script>
</body>
</html>
