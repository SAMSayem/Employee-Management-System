<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timesheet</title>
  <link rel="stylesheet" href="../CSS/Timesheets.css">
</head>
<body>
  <div class="container">
    <h2>Weekly Timesheet</h2>

    <label for="taskCode">Project/Task Code</label>
    <select id="taskCode">
      <option value="PRJ001">PRJ001 - Development</option>
      <option value="PRJ002">PRJ002 - Design</option>
      <option value="PRJ003">PRJ003 - Testing</option>
    </select>

    <button onclick="clockIn()">Clock In</button>
    <button onclick="clockOut()">Clock Out</button>

    <div id="log" class="log"></div>
    <div id="alert" class="alert"></div>
  </div>

  <script src="../JS/Timesheets.js"></script>
</body>
</html>
