<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Org Chart</title>
  <link rel="stylesheet" href="../asset/CSS/Org Chart.css" />
</head>
<body>
  <div id="controls">
    <button class="print-btn" onclick="printChart()">🖨️ Print Chart</button>
  </div>

  <div id="org-chart-container">
    <div class="employee" onclick="window.open('controller/php/OrgChart.php?name=Tanvir%20Ahesan&designation=CEO', '_blank')">
      <img src="../asset/Image/Tanvir.jpg" alt="Tanvir" />
      <p>Tanvir Ahesan<br><small>CEO</small></p>
    </div>
    <div class="employee" onclick="window.open('controller/php/OrgChart.php?name=SAM%20Sayem&designation=CTO', '_blank')">
      <img src="../asset/Image/SAM.png" alt="SAM" />
      <p>SAM Sayem<br><small>CTO</small></p>
    </div>
    </div>

  <div id="profile-popup" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeProfile()">&times;</span>
      <div id="profile-content"></div>
    </div>
  </div>
  <footer>
    <p>&copy; 2025 Employee Management System</p>
    <p><a href="controller/php/logout.php">Logout</a></p> </footer>
  <script src="../asset/JS/Org Chart.js"></script>

</html>
