<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Org Chart</title>
  <link rel="stylesheet" href="../CSS/Org Chart.css" />
</head>
<body>
  <div id="controls">
    <button class="print-btn" onclick="printChart()">🖨️ Print Chart</button>
  </div>

  <div id="org-chart-container">
    <div class="employee" onclick="showProfile('Tanvir', 'CEO')">
      <img src="../Image/Tanvir.jpg" alt="Tanvir" />
      <p>Tanvir Ahesan<br><small>CEO</small></p>
    </div>
    <div class="employee" onclick="showProfile('SAM', 'CTO')">
      <img src="../Image/SAM.png" alt="SAM" />
      <p>SAM Sayem<br><small>CTO</small></p>
    </div>
    <!-- Add more employees similarly -->
  </div>

  <div id="profile-popup" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeProfile()">&times;</span>
      <div id="profile-content"></div>
    </div>
  </div>

  <script src="../JS/Org Chart.js"></script>
</body>
</html>
