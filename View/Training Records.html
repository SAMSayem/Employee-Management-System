<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Training Records</title>
  <link rel="stylesheet" href="../CSS/Training Records.css">
</head>
<body>
  <div class="container">
    <h2>Training Catalog</h2>

    <label for="courseSelect">Choose a Course:</label>
    <select id="courseSelect">
      <option value="HTML Basics">HTML Basics</option>
      <option value="CSS Design">CSS Design</option>
      <option value="JS Functions">JavaScript Functions</option>
    </select>

    <button onclick="registerCourse()">Register</button>

    <div id="registeredCourses"></div>

    <h3>Certification Tracker</h3>
    <button onclick="checkExpiry()">Check Certification Expiry</button>
    <div id="expiryAlert" class="alert"></div>

    <h3>Skills Gap Analysis</h3>
    <button onclick="showGapReport()">Show Report</button>
    <div id="gapReport" class="report"></div>
  </div>

  <script src="../JS/Training Records.js"></script>
</body>
</html>
