
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System - Company Announcements</title>
  <link rel="stylesheet" href="../asset/CSS/Company Announcements.css">
</head>
<body>
<section id="announcements">
  <h2>Company Announcements</h2>


  <form id="announcementForm">

    <label for="announcementDept">Department:</label>
    <select id="announcementDept" name="announcementDept" required>
      <option value="All">All</option>
      <option value="HR">HR</option>
      <option value="Engineering">Engineering</option>
      <option value="Sales">Sales</option>
      <option value="Marketing">Marketing</option>
    </select>

    <label for="announcementPriority">Priority:</label>
    <select id="announcementPriority" name="announcementPriority" required>
      <option value="normal">Normal</option>
      <option value="high">Priority Alert</option>
    </select>

    <label for="announcementMsg">Message:</label>
    <textarea id="announcementMsg" name="announcementMsg" rows="3" required></textarea>

    <button type="submit">Post Announcement</button>
  </form>

  <h3>🚨 Priority Alerts</h3>
  <ul id="priorityAlertsList" class="announcement-feed"></ul>

  <h3>📰 News Feed</h3>
  <ul id="newsFeedList" class="announcement-feed"></ul>
</section>

<footer>
  <p>&copy; 2025 Employee Management System</p>
</footer>

<script src="../asset/JS/Company Announcements.js"></script>
</body>
</html>
