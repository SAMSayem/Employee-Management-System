<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authentication</title>
  <link rel="stylesheet" href="../asset/CSS/Log.css" />
</head>
<body>
  <div class="container">
    <h1 id="authHeader">Login</h1>
    
    <!-- Login Form -->
    <div id="loginForm" class="authForm">
      <form id="login">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" required />

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required />

        <button type="submit">Login</button>
      </form>
      <div class="links">
        <a href="javascript:void(0);" onclick="showSignupForm()">Don't have an account? Sign up</a>
        <a href="javascript:void(0);" onclick="showForgotPasswordForm()">Forgot your password?</a>
      </div>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" class="authForm" style="display: none;">
      <form id="signup">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="Enter your email" required />

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Create a password" required />

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm your password" required />

        <button type="submit">Sign Up</button>
      </form>
      <div class="links">
        <a href="javascript:void(0);" onclick="showLoginForm()">Already have an account? Login</a>
      </div>
    </div>

    <!-- Forgot Password Form -->
    <div id="forgotPasswordForm" class="authForm" style="display: none;">
      <form id="forgotPassword">
        <label for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" placeholder="Enter your email" required />

        <button type="submit">Reset Password</button>
      </form>
      <div class="links">
        <a href="javascript:void(0);" onclick="showLoginForm()">Back to Login</a>
      </div>
    </div>

    <!-- Reset Password Form -->
    <div id="resetPasswordForm" class="authForm" style="display: none;">
      <form id="resetPassword">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" required />

        <label for="confirmNewPassword">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required />

        <button type="submit">Reset Password</button>
      </form>
      <div class="links">
        <a href="javascript:void(0);" onclick="showLoginForm()">Back to Login</a>
      </div>
    </div>

    <!-- Email Verification Form -->
    <div id="emailVerificationForm" class="authForm" style="display: none;">
      <h2>Email Verification</h2>
      <p>Please check your email for the verification link.</p>
      <p>If you haven't received the email, <a href="resend-verification.html">click here</a> to resend the verification link.</p>
      <div class="links">
        <a href="javascript:void(0);" onclick="showLoginForm()">Go back to Login</a>
      </div>
    </div>
  </div>

  <script src="../asset/JS/"></script>
</body>
</html>
