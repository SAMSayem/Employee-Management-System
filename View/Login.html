<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authentication</title>
  <link rel="stylesheet" href="../asset/CSS/Login.css">
</head>
<body>
  <div class="container">

    <!-- Login Form -->
    <form id="loginForm" class="form" action="../controller/php/Login.php" method="POST">
      <input type="hidden" name="action" value="login">
      <h2>Login</h2>
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p><a href="#" onclick="showForm('forgotForm')">Forgot Password?</a></p>
      <p>Don't have an account? <a href="#" onclick="showForm('signupForm')">Sign up</a></p>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="form hidden" action="../controller/php/Login.php" method="POST">
      <input type="hidden" name="action" value="signup">
      <h2>Signup</h2>
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Signup</button>
      <p>Already have an account? <a href="#" onclick="showForm('loginForm')">Login</a></p>
    </form>

    <!-- Forgot Password Form -->
    <form id="forgotForm" class="form hidden" action="../controller/php/Login.php" method="POST">
      <input type="hidden" name="action" value="forgot_password">
      <h2>Forgot Password</h2>
      <input type="email" name="email" placeholder="Enter your email" required />
      <button type="submit">Send Reset Link</button>
      <p>Back to <a href="#" onclick="showForm('loginForm')">Login</a></p>
    </form>

    <!-- Reset Password Form -->
    <form id="resetForm" class="form hidden" action="../controller/php/Login.php" method="POST">
      <input type="hidden" name="action" value="reset_password">
      <h2>Reset Password</h2>
      <input type="hidden" name="token" value="" id="resetToken">
      <input type="password" name="new_password" placeholder="New Password" required />
      <input type="password" name="confirm_password" placeholder="Confirm Password" required />
      <button type="submit">Reset Password</button>
    </form>

    <!-- Email Verification Message -->
    <div id="emailVerification" class="form hidden">
      <h2>Email Verification</h2>
      <p>Please check your inbox for a verification link.</p>
    </div>
    </div>

    <script>
        // JavaScript to toggle between forms
        function showForm(formId) {
          document.querySelectorAll('.form').forEach(f => f.classList.add('hidden'));
          document.getElementById(formId).classList.remove('hidden');
        }
      
        // Auto-load reset form if token in URL
        window.onload = function () {
          const params = new URLSearchParams(window.location.search);
          const token = params.get('token');
          const form = params.get('form');
      
          if (form === 'reset' && token) {
            document.getElementById('resetToken').value = token;
            showForm('resetForm');
          }
        };
      </script>
      </body>
      </html>
