<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="../asset/CSS/Exit Interviews.css">
<head>
<body>

<section id="exit-interviews">
    <h2>Exit Interviews</h2>
    <form id="exitForm">
      <label for="reason">Why are you leaving?</label>
      <textarea id="reason" required></textarea>
  
      <label>Return Checklist:</label>
      <ul>
        <li><input type="checkbox" id="idCard"> ID Card Returned</li>
        <li><input type="checkbox" id="laptop"> Laptop Returned</li>
        <li><input type="checkbox" id="access"> Building Access Revoked</li>
      </ul>
  
      <label>
        <input type="checkbox" id="alumniOptIn"> Join our alumni network
      </label>
  
      <button type="submit">Submit Exit Interview</button>
    </form>
    <p id="exitResponse" style="margin-top: 10px; color: green;"></p>
  </section>
  <footer>
    <p>&copy; 2025 Employee Management System</p>
  </footer>

  <script src="../asset/JS/Exit Interviews.js"></script>
</body>
</html>
